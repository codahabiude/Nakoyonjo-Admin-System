name: Build Android APK

# The Android app is a Capacitor shell that opens the hosted web app.
# Set the repository variable APP_URL (Settings > Secrets and variables > Actions > Variables)
# to your deployed site, e.g. https://school.example.com
# Tag a release as "app-v1.0" etc. to publish the APK to GitHub Releases.

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Hosted app URL (overrides the APP_URL variable)"
        required: false
  push:
    tags: [ 'app-v*' ]

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_URL: ${{ inputs.app_url || vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check APP_URL
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL is not set. Add it as a repository variable or pass app_url when running the workflow."
            exit 1
          fi
          echo "Building app for $APP_URL"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts @capacitor/android@8.5.3

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NDEB-School-Admin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NDEB-School-Admin-APK
          path: NDEB-School-Admin.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" NDEB-School-Admin.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" NDEB-School-Admin.apk \
              --title "NDEB School Admin ${GITHUB_REF_NAME}" --generate-notes
          fi
