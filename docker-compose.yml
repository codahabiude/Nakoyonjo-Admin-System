# Docker Compose for local PostgreSQL database
# Usage: docker compose up -d     (start)
#        docker compose down      (stop)
#        docker compose down -v   (stop + delete data)

services:
  postgres:
    image: postgres:16-alpine
    container_name: school_admin_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: schooladmin
      POSTGRES_PASSWORD: schoolpass
      POSTGRES_DB: school_admin
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Optional: pgAdmin for visual database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: school_admin_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@school.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      - postgres

volumes:
  postgres_data:
